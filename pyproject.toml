[tool.poetry]
name = "strict-abc-lsp"
version = "0.1.0"
description = "ABCMeta that enforces LSP-friendly signatures for abstract methods."
authors = ["Danil Shamsutdinov <a.danil.dark@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Mkrie/strict-abc"
repository = "https://github.com/Mkrie/strict-abc"
keywords = ["abc", "abstract", "lsp", "signature", "typing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
packages = [{ include = "strict_abc", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.5"
mypy = ">=1.10"
twine = ">=5.0"
pre-commit = ">=3.7"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["strict_abc"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/strict_abc"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["strict_abc"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B024", "B027", "F841"]
